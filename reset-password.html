<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do Vizinho — Nova Senha</title>
<link rel="icon" href="/assets/favicon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; background: #F8FAFC; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .card { background: #fff; border-radius: 20px; padding: 40px 32px; width: 100%; max-width: 400px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); text-align: center; }
  .logo { font-size: 52px; margin-bottom: 8px; }
  h1 { font-size: 24px; font-weight: 800; color: #1A1A2E; margin-bottom: 4px; }
  .sub { font-size: 14px; color: #999; margin-bottom: 28px; }
  label { font-size: 13px; font-weight: 700; color: #1A1A2E; display: block; text-align: left; margin-bottom: 6px; }
  input { width: 100%; padding: 14px; border: 1.5px solid #E8E8E8; border-radius: 12px; font-size: 15px; margin-bottom: 14px; outline: none; font-family: inherit; }
  input:focus { border-color: #2DB67D; }
  button { width: 100%; padding: 15px; background: #2DB67D; color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; font-family: inherit; }
  button:disabled { background: #ccc; cursor: default; }
  .msg { margin-top: 14px; padding: 12px; border-radius: 10px; font-size: 13px; display: none; }
  .msg.ok  { background: #E8F5E9; color: #2DB67D; display: block; }
  .msg.err { background: #FFF0F0; color: #E74C3C; display: block; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🏘️</div>
  <h1>Do Vizinho</h1>
  <p class="sub">Digite sua nova senha</p>
  <label>Nova senha</label>
  <input type="password" id="pw1" placeholder="Mínimo 6 caracteres" />
  <label>Confirmar senha</label>
  <input type="password" id="pw2" placeholder="Repita a senha" />
  <button id="btn" onclick="resetPassword()">Salvar nova senha</button>
  <div class="msg" id="msg"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPA_URL = 'https://qdhunieocngxaujmgumn.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkaHVuaWVvY25neGF1am1ndW1uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3NzQzNzMsImV4cCI6MjA4NzM1MDM3M30.9pE4kkyC22VBljy1IDIKBVYZKWQYtGzqsRUK1FM5JLY';
const db = supabase.createClient(SUPA_URL, SUPA_KEY);

const msg = document.getElementById('msg');
const btn = document.getElementById('btn');

// Supabase pode enviar token no hash (#) ou na query string (?)
// Verificar os dois
const hashParams = new URLSearchParams(window.location.hash.substring(1));
const queryParams = new URLSearchParams(window.location.search);

const access_token  = hashParams.get('access_token')  || queryParams.get('access_token');
const refresh_token = hashParams.get('refresh_token') || queryParams.get('refresh_token');
const token_hash    = queryParams.get('token_hash');
const type          = hashParams.get('type') || queryParams.get('type');

// Novo formato: token_hash + type=recovery
const isNewFormat = token_hash && type === 'recovery';
// Formato antigo: access_token + type=recovery
const isOldFormat = access_token && type === 'recovery';

if (!isNewFormat && !isOldFormat) {
  msg.className = 'msg err';
  msg.textContent = 'Link inválido ou expirado. Solicite um novo reset no app.';
  btn.disabled = true;
}

async function resetPassword() {
  const pw1 = document.getElementById('pw1').value;
  const pw2 = document.getElementById('pw2').value;
  msg.className = 'msg';
  if (pw1.length < 6) { msg.className='msg err'; msg.textContent='Senha deve ter pelo menos 6 caracteres.'; return; }
  if (pw1 !== pw2)    { msg.className='msg err'; msg.textContent='As senhas não coincidem.'; return; }
  btn.disabled = true; btn.textContent = 'Salvando...';
  try {
    if (isNewFormat) {
      // Novo formato: verificar OTP primeiro
      const { error: verifyError } = await db.auth.verifyOtp({
        token_hash,
        type: 'recovery'
      });
      if (verifyError) throw verifyError;
    } else {
      // Formato antigo: setar sessão com tokens
      await db.auth.setSession({ access_token, refresh_token });
    }
    const { error } = await db.auth.updateUser({ password: pw1 });
    if (error) throw error;
    msg.className = 'msg ok';
    msg.textContent = '✅ Senha alterada! Pode fechar esta página e entrar no app.';
    btn.textContent = 'Concluído';
  } catch(e) {
    btn.disabled = false; btn.textContent = 'Salvar nova senha';
    msg.className = 'msg err'; msg.textContent = 'Erro: ' + e.message;
  }
}
</script>
</body>
</html>
